# MPU6050 Configuration Parameters

mpu6050_node:
  ros__parameters:
    # I2C Configuration
    i2c_bus: 1  # I2C bus number (usually 1 on Raspberry Pi)
    i2c_address: 0x68  # I2C address (0x68 default, 0x69 if AD0 pin HIGH)

    # ROS2 Configuration
    frame_id: 'imu_Link'  # Frame ID matching URDF
    publish_rate: 50.0  # Publishing rate in Hz

    # Sensor Configuration
    accel_range: 2  # Accelerometer range: 2, 4, 8, or 16 (g)
    gyro_range: 250  # Gyroscope range: 250, 500, 1000, or 2000 (deg/s)

    # Calibration
    enable_calibration: true  # Enable simple stationary calibration
    calibration_samples: 100  # Number of samples for calibration